name: AI Resume Analyzer CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Docker images
        run: docker compose build

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend Docker image
        if: github.event_name == 'push'
        run: docker build -t ghcr.io/${{ github.repository }}/backend:latest ./backend

      - name: Build frontend Docker image
        if: github.event_name == 'push'
        run: docker build -t ghcr.io/${{ github.repository }}/frontend:latest ./frontend

      - name: Push backend Docker image
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository }}/backend:latest

      - name: Push frontend Docker image
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository }}/frontend:latest
